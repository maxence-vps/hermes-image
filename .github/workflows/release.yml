name: Release & build image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release-please:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created || steps.release.outputs['.--release_created'] || steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name || steps.release.outputs['.--tag_name'] }}
      version: ${{ steps.release.outputs.version || steps.release.outputs['.--version'] }}
      major: ${{ steps.release.outputs.major || steps.release.outputs['.--major'] }}
      minor: ${{ steps.release.outputs.minor || steps.release.outputs['.--minor'] }}
      patch: ${{ steps.release.outputs.patch || steps.release.outputs['.--patch'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-and-push:
    needs: release-please
    if: always() && (github.ref_type == 'tag' || needs.release-please.outputs.release_created == 'true' || needs.release-please.outputs.release_created == true)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build & push
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RP_TAG: ${{ needs.release-please.outputs.tag_name }}
          RP_VERSION: ${{ needs.release-please.outputs.version }}
          RP_MAJOR: ${{ needs.release-please.outputs.major }}
          RP_MINOR: ${{ needs.release-please.outputs.minor }}
        run: |
          set -euo pipefail

          if [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
            VERSION="${TAG#v}"
            MAJOR="$(echo "$VERSION" | cut -d. -f1)"
            MINOR="$(echo "$VERSION" | cut -d. -f2)"
          else
            TAG="$RP_TAG"
            VERSION="$RP_VERSION"
            MAJOR="$RP_MAJOR"
            MINOR="$RP_MINOR"
          fi

          IMAGE="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          CLAUDE_CODE_VERSION="$(npm view @anthropic-ai/claude-code version)"
          echo "Building $IMAGE for tag $TAG (version: $VERSION, Claude Code: $CLAUDE_CODE_VERSION)"

          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin

          docker build --pull \
            --build-arg CLAUDE_CODE_VERSION="$CLAUDE_CODE_VERSION" \
            --label org.opencontainers.image.source="https://github.com/${GITHUB_REPOSITORY}" \
            -t "$IMAGE:latest" \
            -t "$IMAGE:$VERSION" \
            -t "$IMAGE:$TAG" \
            -t "$IMAGE:v$MAJOR" \
            -t "$IMAGE:$MAJOR" \
            -t "$IMAGE:v$MAJOR.$MINOR" \
            -t "$IMAGE:$MAJOR.$MINOR" \
            -t "$IMAGE:sha-$SHA" .

          for t in latest "$VERSION" "$TAG" "v$MAJOR" "$MAJOR" "v$MAJOR.$MINOR" "$MAJOR.$MINOR" "sha-$SHA"; do
            docker push "$IMAGE:$t"
          done
