name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created || steps.release.outputs['.--release_created'] || steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name || steps.release.outputs['.--tag_name'] }}
      version: ${{ steps.release.outputs.version || steps.release.outputs['.--version'] }}
      major: ${{ steps.release.outputs.major || steps.release.outputs['.--major'] }}
      minor: ${{ steps.release.outputs.minor || steps.release.outputs['.--minor'] }}
      patch: ${{ steps.release.outputs.patch || steps.release.outputs['.--patch'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-and-push:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' || needs.release-please.outputs.release_created == true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build & push
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
          VERSION: ${{ needs.release-please.outputs.version }}
          MAJOR: ${{ needs.release-please.outputs.major }}
          MINOR: ${{ needs.release-please.outputs.minor }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          CLAUDE_CODE_VERSION="$(npm view @anthropic-ai/claude-code version)"
          echo "Building $IMAGE for release $TAG (version: $VERSION, Claude Code: $CLAUDE_CODE_VERSION)"

          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin

          docker build --pull \
            --build-arg CLAUDE_CODE_VERSION="$CLAUDE_CODE_VERSION" \
            --label org.opencontainers.image.source="https://github.com/${GITHUB_REPOSITORY}" \
            -t "$IMAGE:latest" \
            -t "$IMAGE:$VERSION" \
            -t "$IMAGE:$TAG" \
            -t "$IMAGE:v$MAJOR" \
            -t "$IMAGE:$MAJOR" \
            -t "$IMAGE:v$MAJOR.$MINOR" \
            -t "$IMAGE:$MAJOR.$MINOR" \
            -t "$IMAGE:sha-$SHA" .

          for tag in latest "$VERSION" "$TAG" "v$MAJOR" "$MAJOR" "v$MAJOR.$MINOR" "$MAJOR.$MINOR" "sha-$SHA"; do
            docker push "$IMAGE:$tag"
          done
