name: Build & push image

on:
  push:
    branches: [main]
  schedule:
    # Weekly rebuild to pick up new Hermes and Claude Code releases (Monday 04:17 UTC)
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      hermes_version:
        description: "Hermes base image tag"
        required: false
        default: "latest"

concurrency:
  group: build-image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build & push
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
          HERMES_VERSION: ${{ github.event.inputs.hermes_version || 'latest' }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')/hermes-agent-image"
          DATE="$(date -u +%Y%m%d)"
          # Resolved version: a new Claude Code release busts the layer cache
          CLAUDE_CODE_VERSION="$(npm view @anthropic-ai/claude-code version)"
          echo "Hermes: $HERMES_VERSION | Claude Code: $CLAUDE_CODE_VERSION"

          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin

          docker build --pull \
            --build-arg HERMES_VERSION="$HERMES_VERSION" \
            --build-arg CLAUDE_CODE_VERSION="$CLAUDE_CODE_VERSION" \
            --label org.opencontainers.image.source="https://github.com/${GITHUB_REPOSITORY}" \
            -t "$IMAGE:latest" -t "$IMAGE:$DATE" -t "$IMAGE:sha-$SHA" .

          for tag in latest "$DATE" "sha-$SHA"; do docker push "$IMAGE:$tag"; done
